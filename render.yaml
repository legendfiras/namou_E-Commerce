services:
  - type: web
    name: namou-api
    runtime: node
    buildCommand: npm install --include=dev && npm run build -w namou-api
    startCommand: npm run start -w namou-api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: namou_ecommerce
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
